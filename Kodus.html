<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kodus — Sites que vendem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@300;400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@10..48,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --bg-2: #111111;
    --fg: #f4f1ea;
    --fg-dim: #a8a39a;
    --fg-mute: #6b665d;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.16);
    --accent: #ff5b1f;
    --accent-soft: rgba(255,91,31,.14);
    --card: #131313;
    --card-2: #181818;
    --display: 'Instrument Serif', serif;
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="light"]{
    --bg: #f4f1ea;
    --bg-2: #ebe7dd;
    --fg: #131210;
    --fg-dim: #5c5851;
    --fg-mute: #8a857c;
    --line: rgba(19,18,16,.10);
    --line-strong: rgba(19,18,16,.22);
    --card: #ffffff;
    --card-2: #f9f6ef;
    --accent: #e84a0d;
    --accent-soft: rgba(232,74,13,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
  body{overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  ::selection{background:var(--accent);color:#fff}

  .wrap{max-width:1440px;margin:0 auto;padding:0 32px}
  .grid-bg{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg,var(--line) 1px, transparent 1px);
    background-size:80px 80px;mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);}

  /* nav */
  .nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in oklch, var(--bg) 75%, transparent);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 32px;max-width:1600px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-style:italic;font-size:24px;letter-spacing:-.01em}
  .logo .dot{width:8px;height:8px;background:var(--accent);border-radius:2px;display:inline-block;transform:rotate(45deg)}
  .nav-links{display:flex;gap:28px;font-size:13px;color:var(--fg-dim)}
  .nav-links a:hover{color:var(--fg)}
  .nav-cta{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--fg);color:var(--bg);border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--fg);transition:all .2s}
  .nav-cta:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav-cta .arrow{transition:transform .2s}
  .nav-cta:hover .arrow{transform:translateX(2px)}

  /* shared */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute)}
  .eyebrow::before{content:"";width:6px;height:6px;background:var(--accent);border-radius:50%}
  .display{font-family:var(--display);font-weight:400;letter-spacing:-.02em;line-height:.95}
  .display em{font-style:italic;color:var(--accent)}
  .btn-primary{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;background:var(--accent);color:#fff;border-radius:999px;font-weight:500;font-size:14px;border:1px solid var(--accent);transition:all .2s;cursor:pointer}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px var(--accent)}
  .btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;background:transparent;color:var(--fg);border-radius:999px;font-weight:500;font-size:14px;border:1px solid var(--line-strong);transition:all .2s;cursor:pointer}
  .btn-ghost:hover{border-color:var(--fg);background:var(--card)}

  /* hero common */
  .hero{position:relative;padding:80px 0 100px;overflow:hidden}
  .hero-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);padding:0 32px;margin-bottom:60px}
  .hero-meta .live{display:inline-flex;align-items:center;gap:6px}
  .hero-meta .live::before{content:"";width:6px;height:6px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 4px rgba(34,197,94,.18);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.5}}

  /* HERO 1 — editorial */
  .hero-1 .h1-title{font-family:var(--display);font-weight:400;letter-spacing:-.025em;line-height:.92;font-size:clamp(64px,11vw,176px);margin:0 0 32px}
  .hero-1 .h1-title em{font-style:italic;color:var(--accent)}
  .hero-1 .h1-title .stroke{-webkit-text-stroke:1.5px var(--fg);color:transparent;font-style:italic}
  .hero-1 .h1-row{display:grid;grid-template-columns:1.4fr 1fr;gap:80px;align-items:end;padding:0 32px}
  .hero-1 .h1-sub{font-size:18px;line-height:1.5;color:var(--fg-dim);max-width:420px;margin-bottom:28px}
  .hero-1 .h1-cta{display:flex;gap:12px;flex-wrap:wrap}
  .hero-1 .h1-side{display:flex;flex-direction:column;gap:24px}
  .hero-1 .h1-stat{border-top:1px solid var(--line);padding-top:18px}
  .hero-1 .h1-stat .num{font-family:var(--display);font-style:italic;font-size:48px;line-height:1;color:var(--fg)}
  .hero-1 .h1-stat .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-mute);margin-top:6px}

  /* HERO 2 — type-stack manifesto */
  .hero-2{padding:60px 0 80px}
  .hero-2 .stack{padding:0 32px;display:flex;flex-direction:column;gap:0}
  .hero-2 .line{font-family:var(--display);font-weight:400;letter-spacing:-.03em;line-height:.95;font-size:clamp(72px,13vw,200px);display:flex;align-items:center;gap:24px}
  .hero-2 .line em{font-style:italic;color:var(--accent)}
  .hero-2 .line .badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);background:var(--card);padding:8px 14px;border-radius:999px;border:1px solid var(--line);align-self:center}
  .hero-2 .line .pill-img{width:120px;height:60px;border-radius:999px;background:linear-gradient(120deg,var(--card),var(--card-2));border:1px solid var(--line);display:inline-block;position:relative;overflow:hidden}
  .hero-2 .line .pill-img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px)}
  .hero-2 .footer-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:48px;padding:0 32px;gap:40px;flex-wrap:wrap}
  .hero-2 .footer-row p{max-width:420px;color:var(--fg-dim);font-size:16px;line-height:1.55;margin:0}

  /* HERO 3 — split with mock browser */
  .hero-3{padding:60px 0 80px}
  .hero-3 .split{display:grid;grid-template-columns:1fr 1.1fr;gap:60px;padding:0 32px;align-items:center}
  .hero-3 .h3-title{font-family:var(--display);font-weight:400;letter-spacing:-.025em;line-height:.94;font-size:clamp(56px,7vw,108px);margin:0 0 24px}
  .hero-3 .h3-title em{font-style:italic;color:var(--accent)}
  .hero-3 .h3-sub{font-size:17px;line-height:1.55;color:var(--fg-dim);max-width:460px;margin-bottom:32px}
  .hero-3 .h3-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
  .hero-3 .h3-trust{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute)}
  .hero-3 .avatars{display:flex}
  .hero-3 .avatars span{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;background:linear-gradient(135deg,#666,#222)}
  .hero-3 .avatars span:first-child{margin-left:0;background:linear-gradient(135deg,var(--accent),#7a1f0a)}
  .hero-3 .avatars span:nth-child(2){background:linear-gradient(135deg,#3b82f6,#1e3a8a)}
  .hero-3 .avatars span:nth-child(3){background:linear-gradient(135deg,#22c55e,#14532d)}

  .browser{border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
  .browser-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--card-2);border-bottom:1px solid var(--line)}
  .browser-bar .d{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
  .browser-bar .url{margin-left:12px;flex:1;height:22px;border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:10px;color:var(--fg-mute);display:flex;align-items:center;padding:0 10px}
  .browser-body{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1410 0%,#0a0a0a 100%);position:relative;overflow:hidden}
  .browser-body .nav-mini{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--fg-mute);letter-spacing:.08em}
  .browser-body .h-mock{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);font-family:var(--display);font-style:italic;font-size:clamp(28px,4.4vw,68px);line-height:.95;color:var(--fg);letter-spacing:-.02em}
  .browser-body .h-mock span{color:var(--accent)}
  .browser-body .cta-mock{position:absolute;left:20px;bottom:24px;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:500}
  .browser-body .blob{position:absolute;right:-60px;bottom:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.3;filter:blur(40px)}

  /* marquee */
  .marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;overflow:hidden;background:var(--bg-2)}
  .marquee-track{display:flex;gap:60px;animation:scroll 40s linear infinite;white-space:nowrap}
  .marquee-track span{font-family:var(--display);font-style:italic;font-size:32px;color:var(--fg-dim)}
  .marquee-track .star{color:var(--accent);font-style:normal}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* SECTION HEADER */
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px;margin-bottom:48px;gap:40px;flex-wrap:wrap}
  .sec-head h2{font-family:var(--display);font-weight:400;letter-spacing:-.02em;line-height:.95;font-size:clamp(48px,7vw,96px);margin:0;max-width:18ch}
  .sec-head h2 span{display:block;white-space:nowrap}
  .sec-head h2 em{font-style:italic;color:var(--accent)}
  .sec-head .meta{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);max-width:320px;text-align:right;line-height:1.6}
  section{position:relative}
  .section-pad{padding:120px 0}

  /* manifesto */
  .manifesto{padding:120px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .manifesto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 32px}
  .m-card{padding:32px 32px 32px 0;border-right:1px solid var(--line);position:relative}
  .m-card:last-child{border-right:0}
  .m-card:first-child{padding-left:0}
  .m-card:not(:first-child){padding-left:32px}
  .m-card .num{font-family:var(--mono);font-size:11px;color:var(--fg-mute);letter-spacing:.08em}
  .m-card h3{font-family:var(--display);font-weight:400;font-style:italic;font-size:36px;margin:12px 0 14px;line-height:1.05;letter-spacing:-.01em}
  .m-card p{font-size:15px;line-height:1.55;color:var(--fg-dim);margin:0}

  /* services */
  .services{padding:120px 0}
  .svc-list{padding:0 32px;border-top:1px solid var(--line)}
  .svc-row{display:grid;grid-template-columns:80px 1fr;gap:32px;align-items:center;padding:36px 0;border-bottom:1px solid var(--line);position:relative;transition:all .3s}
  .svc-row:hover{background:linear-gradient(90deg,transparent, var(--accent-soft), transparent)}
  .svc-row .idx{font-family:var(--mono);font-size:12px;color:var(--fg-mute);letter-spacing:.06em}
  .svc-row .name{font-family:var(--display);font-size:clamp(36px,5vw,68px);line-height:1;letter-spacing:-.02em;white-space:nowrap}
  .svc-row .name em{font-style:italic;color:var(--accent);transition:color .3s}
  .svc-row .name .it{font-style:italic}
  .svc-row .desc{font-size:15px;line-height:1.5;color:var(--fg-dim);max-width:38ch}
  .svc-row .price{text-align:right;font-family:var(--mono);font-size:12px;color:var(--fg-mute);letter-spacing:.04em;line-height:1.6}
  .svc-row .price b{display:block;font-family:var(--display);font-style:italic;font-size:28px;color:var(--fg);font-weight:400;letter-spacing:-.01em;margin-bottom:4px}
  .svc-row .arrow-svg{position:absolute;right:0;top:50%;transform:translateY(-50%) translateX(20px);opacity:0;transition:all .3s;color:var(--accent)}
  .svc-row:hover .arrow-svg{opacity:1;transform:translateY(-50%) translateX(0)}

  /* process */
  .process{padding:120px 0;background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .proc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);padding:0 32px;margin:0 -1px}
  .p-step{background:var(--bg-2);padding:36px 24px;display:flex;flex-direction:column;gap:14px;min-height:280px}
  .p-step .step-num{font-family:var(--display);font-style:italic;font-size:80px;line-height:.9;color:var(--accent);letter-spacing:-.02em}
  .p-step h4{font-family:var(--sans);font-size:18px;font-weight:500;margin:0;letter-spacing:-.01em}
  .p-step p{font-size:14px;line-height:1.55;color:var(--fg-dim);margin:0}
  .p-step .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);margin-top:auto}

  /* work */
  .work{padding:120px 0}
  .work-grid{display:grid;grid-template-columns:1.4fr 1fr;grid-auto-rows:minmax(0,auto);gap:24px;padding:0 32px}
  .w-card{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);transition:all .3s;cursor:pointer}
  .w-card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .w-thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--card-2),var(--card));position:relative;overflow:hidden}
  .w-thumb.lg{aspect-ratio:16/11}
  .w-thumb::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.03) 14px 15px)}
  .w-thumb .placeholder-tag{position:absolute;top:16px;left:16px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
  .w-thumb .live-tag{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:10px;color:var(--fg-mute);background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
  .w-thumb .live-tag::before{content:"";width:6px;height:6px;background:#22c55e;border-radius:50%}
  .w-thumb .mock-h{position:absolute;left:24px;bottom:64px;font-family:var(--display);font-style:italic;font-size:clamp(24px,3.4vw,52px);line-height:1;color:var(--fg);letter-spacing:-.02em;max-width:80%}
  .w-thumb .mock-h span{color:var(--accent)}
  .w-thumb .mock-cta{position:absolute;left:24px;bottom:24px;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--fg);background:var(--accent);padding:8px 12px;border-radius:6px}
  .w-thumb.style-2{background:linear-gradient(135deg,#0a1628,#0a0a0a)}
  .w-thumb.style-3{background:linear-gradient(135deg,#1a0a0a,#0a0a0a)}
  .w-thumb.style-4{background:linear-gradient(135deg,#0a1a14,#0a0a0a)}
  .w-thumb.style-5{background:linear-gradient(135deg,#180a1a,#0a0a0a)}
  .w-thumb.style-6{background:linear-gradient(135deg,#1a1408,#0a0a0a)}
  .w-meta{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}
  .w-meta .ttl{font-family:var(--display);font-style:italic;font-size:22px;letter-spacing:-.01em}
  .w-meta .yr{font-family:var(--mono);font-size:12px;color:var(--fg-mute)}
  .w-meta .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--fg-mute);letter-spacing:.08em}

  /* testimonial */
  .testi{padding:120px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .testi-inner{padding:0 32px;display:grid;grid-template-columns:1.6fr 1fr;gap:80px;align-items:center}
  .testi-quote{font-family:var(--display);font-weight:400;letter-spacing:-.02em;line-height:1.05;font-size:clamp(40px,5.4vw,84px);margin:0}
  .testi-quote em{font-style:italic;color:var(--accent)}
  .testi-quote .open{color:var(--fg-mute);font-style:italic;margin-right:6px}
  .testi-quote .close{color:var(--fg-mute);font-style:italic;margin-left:4px}
  .testi-author{display:flex;align-items:center;gap:14px;margin-top:32px}
  .testi-author .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7a1f0a)}
  .testi-author .name{font-weight:500;font-size:15px}
  .testi-author .role{font-family:var(--mono);font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .testi-stats{display:flex;flex-direction:column;gap:32px}
  .testi-stat{border-left:2px solid var(--accent);padding-left:18px}
  .testi-stat b{display:block;font-family:var(--display);font-style:italic;font-size:64px;line-height:.95;color:var(--fg);font-weight:400;letter-spacing:-.02em}
  .testi-stat span{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--fg-mute);letter-spacing:.06em;margin-top:6px;display:block}

  /* faq */
  .faq{padding:120px 0}
  .faq-grid{padding:0 32px;display:grid;grid-template-columns:1fr 1.4fr;gap:80px}
  .faq-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .faq-item{border-bottom:1px solid var(--line);padding:24px 0;cursor:pointer}
  .faq-q{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.2;letter-spacing:-.01em}
  .faq-q .plus{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:transform .3s;font-family:var(--sans);font-style:normal;font-size:20px}
  .faq-item[data-open="true"] .plus{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s,padding .3s;opacity:0;color:var(--fg-dim);font-size:15px;line-height:1.6}
  .faq-item[data-open="true"] .faq-a{max-height:300px;opacity:1;padding-top:14px}

  /* CTA final */
  .cta-final{padding:140px 0;text-align:center;border-top:1px solid var(--line);position:relative;overflow:hidden}
  .cta-final::before{content:"";position:absolute;left:50%;top:50%;width:1200px;height:1200px;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--accent-soft) 0%,transparent 60%);pointer-events:none}
  .cta-final .eyebrow{justify-content:center;display:inline-flex;margin-bottom:24px}
  .cta-final h2{font-family:var(--display);font-weight:400;letter-spacing:-.025em;line-height:.92;font-size:clamp(64px,11vw,176px);margin:0 0 20px;position:relative}
  .cta-final h2 em{font-style:italic;color:var(--accent)}
  .cta-final p{max-width:520px;margin:0 auto 36px;color:var(--fg-dim);font-size:17px;line-height:1.5;position:relative}
  .cta-final .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
  .cta-final .secondary-info{margin-top:40px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);position:relative}
  .cta-final .secondary-info b{color:var(--fg);font-weight:500}

  /* footer */
  footer{border-top:1px solid var(--line);padding:60px 0 32px}
  .ftr-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:60px;padding:0 32px;margin-bottom:60px}
  .ftr-brand{font-family:var(--display);font-style:italic;font-size:64px;line-height:1;letter-spacing:-.02em}
  .ftr-brand .accent{color:var(--accent)}
  .ftr-tagline{margin-top:16px;color:var(--fg-dim);font-size:14px;max-width:320px;line-height:1.5}
  .ftr-col h5{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);margin:0 0 16px;font-weight:500}
  .ftr-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .ftr-col a{font-size:14px;color:var(--fg-dim)}
  .ftr-col a:hover{color:var(--fg)}
  .ftr-bottom{padding:24px 32px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-mute);flex-wrap:wrap;gap:12px}

  /* scroll reveal helpers */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
  .reveal.in{opacity:1;transform:none}

  /* responsive */
  @media (max-width:980px){
    .hero-1 .h1-row{grid-template-columns:1fr;gap:40px}
    .hero-3 .split{grid-template-columns:1fr;gap:40px}
    .manifesto-grid{grid-template-columns:1fr;gap:0}
    .m-card{border-right:0;border-bottom:1px solid var(--line);padding:24px 0!important}
    .m-card:last-child{border-bottom:0}
    .svc-row{grid-template-columns:60px 1fr;row-gap:8px;padding:24px 0}
    .svc-row .name{font-size:clamp(28px,7vw,42px);white-space:normal}
    .proc-grid{grid-template-columns:1fr 1fr}
    .work-grid{grid-template-columns:1fr}
    .testi-inner{grid-template-columns:1fr;gap:40px}
    .faq-grid{grid-template-columns:1fr;gap:40px}
    .ftr-top{grid-template-columns:1fr 1fr;gap:32px}
    .nav-links{display:none}
  }
  @media (max-width:600px){
    .wrap{padding:0 20px}
    .nav-inner{padding:0 20px}
    .hero-meta,.sec-head,.svc-list,.proc-grid,.work-grid,.testi-inner,.faq-grid,.ftr-top,.ftr-bottom,.hero-1 .h1-row,.hero-2 .stack,.hero-2 .footer-row,.hero-3 .split{padding-left:20px;padding-right:20px}
    .proc-grid{grid-template-columns:1fr}
  }
</style>
